server:
  port: 8080

spring:
  application:
    name: api-gateway

  config:
    import: "configserver:http://localhost:8888"

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # USER SERVICE
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/users/**
              filters:
                - RewritePath=/users/(?<segment>.*), /users/${segment}

            # PRODUCT SERVICE
            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/products/**
              filters:
                - RewritePath=/products/(?<segment>.*), /products/${segment}

            # ORDER SERVICE
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/orders, /orders/**
              filters:
                - RewritePath=/orders/(?<segment>.*), /orders/${segment}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/